name: Release

on:
  push:
    branches: [master]
    paths:
      - '.github/release-manifests/*.json'

# Releases are triggered by the merge itself: a release PR adds .github/release-manifests/<tag>.json,
# and landing it on master is what cuts the tag and the GitHub release — no separate tagging step, so
# no throwaway branch/commit/tag to create just to point CI at a commit that already exists. Grouped
# on the commit rather than a tag name (which is not known until the descriptor step below resolves
# it) so two release PRs merged back-to-back cannot cancel each other's build.
concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & Package
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.descriptor.outputs.tag }}
      skip: ${{ steps.descriptor.outputs.skip }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - name: Checkout merged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # A release manifest is what makes this push a release, not merely a push that touched the
      # release-manifests folder: a PR that only edits a descriptor whose tag has already shipped has
      # nothing new to release (the "already exists" check below skips it; a modified descriptor whose
      # release was never created is released), and github.event.before is the all-zeros SHA on
      # a branch's first push, so there is nothing to diff against. Both cases skip the run rather
      # than fail it — this workflow's paths filter already limits it to pushes that plausibly mean
      # to ship something, and a plain skip keeps a "checks passed" branch protection rule from
      # blocking on a run that had genuinely nothing to do.
      - name: Resolve the merged release descriptor
        id: descriptor
        shell: pwsh
        env:
          BEFORE_SHA: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:BEFORE_SHA -match '^0+$') {
            Write-Host "No previous commit to diff (first push on this ref) — skipping."
            "skip=true" >> $env:GITHUB_OUTPUT
            exit 0
          }

          $added = git diff --no-renames --diff-filter=AM --name-only $env:BEFORE_SHA $env:GITHUB_SHA -- '.github/release-manifests/*.json'
          $added = @($added | Where-Object { $_ })
          if ($added.Count -eq 0) {
            Write-Host "No release descriptor was added or changed by this push — skipping."
            "skip=true" >> $env:GITHUB_OUTPUT
            exit 0
          }

          $tags = @($added | ForEach-Object { [System.IO.Path]::GetFileNameWithoutExtension($_) } | Sort-Object -Unique)
          if ($tags.Count -ne 1) {
            throw "Expected exactly one release descriptor per merge, found $($tags.Count): $($tags -join ', '). Split into separate release PRs."
          }
          $tag = $tags[0]

          # Idempotency: a re-run (manual re-trigger, or a workflow retry) must not try to create a
          # release that already exists, since gh release create would simply fail on it.
          # A missing tag is the normal case for a new release.  GitHub Actions runs
          # PowerShell with ErrorActionPreference=Stop, so allow gh's expected non-zero
          # result through, record it, and clear the native exit code before this step ends.
          $previousErrorActionPreference = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          gh release view $tag --json tagName *> $null
          $releaseExists = $LASTEXITCODE -eq 0
          $global:LASTEXITCODE = 0
          $ErrorActionPreference = $previousErrorActionPreference
          if ($releaseExists) {
            Write-Host "Release $tag already exists — skipping."
            "skip=true" >> $env:GITHUB_OUTPUT
            exit 0
          }

          "skip=false" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Validate release descriptor
        id: release
        if: steps.descriptor.outputs.skip != 'true'
        shell: pwsh
        env:
          TAG: ${{ steps.descriptor.outputs.tag }}
        run: |
          .\scripts\Test-ReleaseDescriptor.ps1 -Tag $env:TAG
          $manifest = Get-Content ".github/release-manifests/$env:TAG.json" -Raw | ConvertFrom-Json
          # The step below reads this as a string and compares it to 'true', so emit the word
          # rather than casting the comparison: a PowerShell cast binds looser than a method call,
          # so [string](...).ToLowerInvariant() called ToLowerInvariant on the Boolean itself and
          # threw before any release could be created.
          "prerelease=$(if ($manifest.channel -eq 'preview') { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT
          "plugins=$($manifest.plugins -join ',')" >> $env:GITHUB_ENV

      # Always the latest engine release: the plugin ships to people running the latest engine, so
      # that is what replay-parity must pass against. The resolved tag is recorded in the release
      # notes, so "tested against" stays true even after newer engines ship.
      - name: Resolve latest engine version
        id: engine_version
        if: steps.descriptor.outputs.skip != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $engineVersion = (gh release view -R PetitCastor/ocrx-releases --json tagName --jq .tagName).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $engineVersion) { throw "Could not resolve the latest ocrx-releases release." }
          "version=$engineVersion" >> $env:GITHUB_OUTPUT

      - name: Setup .NET
        if: steps.descriptor.outputs.skip != 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download engine release
        if: steps.descriptor.outputs.skip != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ENGINE_VERSION: ${{ steps.engine_version.outputs.version }}
        run: |
          gh release download $env:ENGINE_VERSION -R PetitCastor/ocrx-releases -p "Ocrx.Engine-*-win-x64.zip" -D .
          if ($LASTEXITCODE -ne 0) { throw "Could not download engine release $env:ENGINE_VERSION." }
          Expand-Archive -Path "Ocrx.Engine-*-win-x64.zip" -DestinationPath engine
          $enginePath = (Get-ChildItem -Path engine -Filter "Ocrx.Engine.exe" -Recurse | Select-Object -First 1).FullName
          if (-not $enginePath) { throw "Ocrx.Engine.exe not found after extracting the engine release." }
          "OCRX_ENGINE_PATH=$enginePath" >> $env:GITHUB_ENV

      - name: Restore
        if: steps.descriptor.outputs.skip != 'true'
        run: dotnet restore OcrxPlugins.slnx

      - name: Build
        if: steps.descriptor.outputs.skip != 'true'
        run: dotnet build OcrxPlugins.slnx --no-restore -c Release

      - name: Test
        if: steps.descriptor.outputs.skip != 'true'
        run: dotnet test OcrxPlugins.slnx --no-build -c Release --verbosity normal -m:1

      - name: Plugin boundary grep gate
        if: steps.descriptor.outputs.skip != 'true'
        shell: bash
        run: |
          if rg -n -g '*.cs' "using Grpc|RpcException|Ocrx\.Contracts\.Proto|Ocrx\.Engine" src/; then
            echo "::error::Plugin boundary violation — a plugin references an engine/transport internal (listed above)."
            exit 1
          fi

      - name: Publish selected plugins
        if: steps.descriptor.outputs.skip != 'true'
        shell: pwsh
        run: |
          . ./scripts/ReleaseDescriptor.Validate.ps1
          New-Item -ItemType Directory -Path release-assets -Force | Out-Null
          $projects = @{}
          foreach ($name in $script:AllowedPlugins) { $projects[$name] = "src/$name" }
          $selected = $env:plugins.Split(',', [System.StringSplitOptions]::RemoveEmptyEntries)
          $archives = [System.Collections.Generic.List[string]]::new()
          foreach ($plugin in $selected) {
            if (-not $projects.ContainsKey($plugin)) { throw "Unknown plugin selected after validation: $plugin" }
            dotnet publish $projects[$plugin] -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o "publish/$plugin"
            $executable = "publish/$plugin/$plugin.exe"
            if (-not (Test-Path $executable)) { throw "Missing publish output: $executable" }
            $archive = "$plugin-win-x64.zip"
            Compress-Archive -Path "publish/$plugin/*" -DestinationPath "release-assets/$archive"
            $archives.Add($archive)
          }
          $archives | Set-Content -Encoding utf8 release-assets.txt

      - name: Write release notes
        if: steps.descriptor.outputs.skip != 'true'
        shell: pwsh
        env:
          TAG: ${{ steps.descriptor.outputs.tag }}
          ENGINE_VERSION: ${{ steps.engine_version.outputs.version }}
        run: |
          $manifest = Get-Content ".github/release-manifests/$env:TAG.json" -Raw | ConvertFrom-Json
          @"
          Tested against OCRX engine $env:ENGINE_VERSION.

          $($manifest.notes)
          "@ | Out-File -Encoding utf8 release-notes.md

      - name: Upload release payload
        if: steps.descriptor.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-payload-${{ steps.descriptor.outputs.tag }}
          path: |
            release-assets/*-win-x64.zip
            release-assets.txt
            release-notes.md
          if-no-files-found: error
          retention-days: 1

  release:
    name: Create Release
    runs-on: windows-latest
    needs: build
    if: needs.build.outputs.skip != 'true'
    permissions:
      contents: write
    steps:
      - name: Download release payload
        uses: actions/download-artifact@v4
        with:
          name: release-payload-${{ needs.build.outputs.tag }}
          path: release-payload

      # The scripts and the descriptor, at the merged commit, for the changelog step below. Checked out
      # into a subfolder so the downloaded payload is left exactly as the build job produced it.
      - name: Checkout merged source
        uses: actions/checkout@v4
        with:
          path: source
          persist-credentials: false

      # The cumulative CHANGELOG.md the engine's plugin manager reads off a release to show what an
      # update changes (ocrx-engine PluginChangelogSource reads releases/download/<tag>/CHANGELOG.md).
      # Built from the descriptor's `changes` (scripts/Build-Changelog.ps1) on top of the previous stable
      # release's asset, so one file carries every version and a user skipping releases sees all of them.
      # A preview gets only its own section: previews are pinned, with no "latest" lineage.
      #
      # Here, in the release job, immediately before the release is created, and not in the build job:
      # runs are grouped per commit, so two release PRs merged back to back build in parallel, and a base
      # read minutes before the build finished would let the second release be built on the same base as
      # the first and drop the first one's section for good. This narrows that window to seconds.
      #
      # "Previous" is the newest stable release that carries a CHANGELOG.md, walking back from GitHub's
      # latest (which excludes prereleases and does not yet include this release). One that lacks the
      # asset (a failed upload) is skipped rather than resetting the whole history. When no release has
      # one (every release before this step existed), the history starts here. A failure to read the
      # release list throws rather than publish a changelog that silently forgets earlier versions.
      - name: Build changelog
        shell: pwsh
        env:
          TAG: ${{ needs.build.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $descriptor = "source/.github/release-manifests/$env:TAG.json"
          $manifest = Get-Content $descriptor -Raw | ConvertFrom-Json
          $buildArgs = @{ Descriptor = $descriptor; OutDir = 'changelog' }

          if ($manifest.channel -eq 'stable') {
            $list = gh release list --repo $env:GH_REPO --exclude-pre-releases --limit 20 --json tagName
            if ($LASTEXITCODE -ne 0) { throw 'Could not list the previous releases.' }
            foreach ($previous in @($list | ConvertFrom-Json)) {
              $assets = gh release view $previous.tagName --repo $env:GH_REPO --json assets --jq '.assets[].name'
              if ($LASTEXITCODE -ne 0) { throw "Could not read release $($previous.tagName)." }
              if (@($assets) -contains 'CHANGELOG.md') {
                gh release download $previous.tagName --repo $env:GH_REPO --pattern CHANGELOG.md --dir changelog-base
                if ($LASTEXITCODE -ne 0) { throw "Could not download CHANGELOG.md from release $($previous.tagName)." }
                $buildArgs.BasePath = 'changelog-base/CHANGELOG.md'
                Write-Host "Building on the changelog of $($previous.tagName)."
                break
              }
            }
          }

          ./source/scripts/Build-Changelog.ps1 @buildArgs
          "`n" + (Get-Content changelog/release-notes-changes.md -Raw) | Out-File -Encoding utf8 -Append release-payload/release-notes.md
          Get-Content release-payload/release-notes.md

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          $assets = [System.Collections.Generic.List[string]]::new()
          foreach ($assetName in Get-Content 'release-payload/release-assets.txt') {
            if ($assetName -notmatch '^[A-Za-z0-9]+-win-x64[.]zip$') { throw "Unsafe release asset name: $assetName" }
            $asset = Join-Path 'release-payload/release-assets' $assetName
            if (-not (Test-Path -LiteralPath $asset)) { throw "Missing selected release asset: $assetName" }
            $assets.Add((Resolve-Path -LiteralPath $asset).Path)
          }
          if ($assets.Count -eq 0) { throw 'No plugin archives were produced.' }
          # A fixed, separately named asset rather than a looser archive-name rule above: the engine reads
          # it at releases/download/<tag>/CHANGELOG.md, and nothing else may ride along with it.
          $changelog = 'changelog/CHANGELOG.md'
          if (-not (Test-Path -LiteralPath $changelog)) { throw "Missing release asset: $changelog" }
          $assets.Add((Resolve-Path -LiteralPath $changelog).Path)
          $arguments = @('release', 'create', $env:TAG, '-R', $env:GH_REPO, '--target', $env:GITHUB_SHA, '--notes-file', 'release-payload/release-notes.md')
          if ($env:PRERELEASE -eq 'true') { $arguments += '--prerelease' }
          $arguments += $assets
          & gh @arguments
