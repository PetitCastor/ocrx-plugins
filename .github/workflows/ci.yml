name: CI

on:
  pull_request:
    branches: [master]

# No job here pushes, releases, or comments — read-only checkout is all it needs.
permissions:
  contents: read

jobs:
  build-test:
    name: Build & Test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate plugin catalogs
        shell: pwsh
        run: ./scripts/Test-PluginCatalog.ps1

      # Regression guard for the "latest" downloadUrl bug, stable channel ONLY: the engine
      # resolves "is there an update?" by HEAD-probing downloadUrl and reading the release tag
      # off the redirect. A version-pinned URL (/releases/download/vX.Y.Z/...) redirects to
      # itself, so the engine's update check always short-circuits to that one tag and never
      # detects a newer release. Every plugins.json entry must use the version-less
      # .../releases/latest/download/... form so the redirect always resolves to the current
      # release. This must never touch plugins.preview.json: Test-PluginCatalog.ps1 intentionally
      # requires preview entries to PIN an exact release tag (there is no "latest" alias for a
      # preview build), so a version-less rule there would fight that check.
      - name: Catalog download URL format gate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pattern = '^https://github\.com/PetitCastor/ocrx-plugins/releases/latest/download/[A-Za-z0-9]+-win-x64\.zip$'
          $failures = [System.Collections.Generic.List[string]]::new()

          foreach ($path in @('plugins.json')) {
              $parsed = Get-Content -LiteralPath $path -Raw -Encoding UTF8 | ConvertFrom-Json
              # ConvertFrom-Json turns a JSON "[]" into $null, not an empty array.
              $entries = if ($null -eq $parsed) { @() } else { @($parsed) }

              foreach ($entry in $entries) {
                  if ($entry.downloadUrl -notmatch $pattern) {
                      $failures.Add("${path}: entry '$($entry.id)' has a non-'latest' downloadUrl: $($entry.downloadUrl)")
                  }
              }
          }

          if ($failures.Count -gt 0) {
              $failures | ForEach-Object { Write-Host "::error::$_" }
              throw "$($failures.Count) catalog entry/entries use a version-pinned downloadUrl instead of the version-less /releases/latest/download/ form."
          }

          Write-Host "All catalog downloadUrl entries use the version-less latest form."

      - name: Release-descriptor validation checks
        shell: pwsh
        run: ./scripts/Test-ReleaseDescriptor.Tests.ps1

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Pinned per 00-OVERVIEW.md's "Plugins-repo CI" decision: this repo consumes Ocrx.Engine
      # as a released binary, never a source checkout. OCRX_ENGINE_PATH is what
      # Ocrx.Sdk.Testing's EngineLocator.Resolve() reads (see ReplayParityTests in both test
      # projects) to spawn the real engine for parity comparisons.
      - name: Download pinned engine release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $engineVersion = (Get-Content engine-version.txt).Trim()
          gh release download $engineVersion -R PetitCastor/ocrx-releases -p "Ocrx.Engine-*-win-x64.zip" -D .
          Expand-Archive -Path "Ocrx.Engine-*-win-x64.zip" -DestinationPath engine
          $enginePath = (Get-ChildItem -Path engine -Filter "Ocrx.Engine.exe" -Recurse | Select-Object -First 1).FullName
          if (-not $enginePath) {
            Write-Error "Ocrx.Engine.exe not found after extracting the pinned release."
            exit 1
          }
          echo "OCRX_ENGINE_PATH=$enginePath" >> $env:GITHUB_ENV

      - name: Restore
        run: dotnet restore OcrxPlugins.slnx

      - name: Build
        run: dotnet build OcrxPlugins.slnx --no-restore -c Release

      # Runs SignaturePlugin's unit suite plus its replay-parity tests against the pinned engine
      # binary above. MissionPlugin and RefineryPlugin are frozen proofs of concept outside
      # OcrxPlugins.slnx and have no tests — a green run here says nothing about them.
      # Serialize test projects: xUnit collections cannot coordinate the Windows OCR engine
      # processes spawned by separate test assemblies.
      - name: Test
        run: dotnet test OcrxPlugins.slnx --no-build -c Release --verbosity normal -m:1

      # A plugin owns parsing and nothing else: it must not name a transport type (Grpc,
      # RpcException), the wire proto namespace, or the engine assembly. `dotnet build` cannot catch
      # a re-coupling — a plugin that added `using Grpc.Core;` still compiles against the SDK's public
      # surface — so this greps plugin SOURCES (.cs only) for the forbidden references. Moved here
      # from the mono-repo's ci.yml (SPLIT-MANIFEST.md's "Workflow split plan") and re-pointed at
      # src/ directly: this repo has no src/Plugins/ level, every plugin sits at src/<Plugin>/. The
      # sweep is over src/, not the solution, so the frozen proofs of concept stay inside the gate
      # even though nothing builds them.
      - name: Plugin boundary grep gate
        shell: bash
        run: |
          if rg -n -g '*.cs' "using Grpc|RpcException|Ocrx\.Contracts\.Proto|Ocrx\.Engine" src/; then
            echo "::error::Plugin boundary violation — a plugin references an engine/transport internal (listed above)."
            exit 1
          fi
          echo "Plugin boundary clean: no engine/transport references under src/."

      # Neither the message nor the pattern may spell the retired name, or the gate matches its own
      # source. Writing the pattern with character classes reads as the same string to grep without
      # the literal appearing in this file, so the gate needs no exclusion for itself and does not
      # depend on a tool skipping dot-directories by default — which is the only reason the earlier
      # rg form passed. Same pattern as the gates in ocrx-engine, ocrx-sdk and ocrx-site.
      - name: Legacy identity gate
        shell: bash
        run: |
          matches=$(grep -RInE '[G]ameCapture|[g]amecapture' . \
            --exclude-dir=.git \
            --exclude-dir=bin \
            --exclude-dir=obj || true)
          if [ -n "$matches" ]; then
            echo "$matches"
            echo "::error::Stale legacy identity found."
            exit 1
          fi

      - name: Restore repository tools
        run: dotnet tool restore

      - name: Slopwatch
        run: dotnet slopwatch analyze -d .
