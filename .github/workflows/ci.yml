name: CI

on:
  pull_request:
    branches: [master]
  # Manual run, optionally against a specific engine release instead of the latest one — for
  # bisecting an engine regression. Empty means latest.
  workflow_dispatch:
    inputs:
      engine_version:
        description: 'Engine release tag from ocrx-releases (e.g. v2.0.56). Empty = latest.'
        required: false
        default: ''

# No job here pushes, releases, or comments — read-only checkout is all it needs.
permissions:
  contents: read

jobs:
  build-test:
    name: Build & Test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The descriptor check below diffs the pull request against its base, so it needs both histories.
          fetch-depth: 0

      - name: Validate plugin catalogs
        shell: pwsh
        run: ./scripts/Test-PluginCatalog.ps1

      # Regression guard for the "latest" downloadUrl bug, stable channel ONLY: the engine
      # resolves "is there an update?" by HEAD-probing downloadUrl and reading the release tag
      # off the redirect. A version-pinned URL (/releases/download/vX.Y.Z/...) redirects to
      # itself, so the engine's update check always short-circuits to that one tag and never
      # detects a newer release. Every plugins.json entry must use the version-less
      # .../releases/latest/download/... form so the redirect always resolves to the current
      # release. This must never touch plugins.preview.json: Test-PluginCatalog.ps1 intentionally
      # requires preview entries to PIN an exact release tag (there is no "latest" alias for a
      # preview build), so a version-less rule there would fight that check.
      - name: Catalog download URL format gate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pattern = '^https://github\.com/PetitCastor/ocrx-plugins/releases/latest/download/[A-Za-z0-9]+-win-x64\.zip$'
          $failures = [System.Collections.Generic.List[string]]::new()

          foreach ($path in @('plugins.json')) {
              $parsed = Get-Content -LiteralPath $path -Raw -Encoding UTF8 | ConvertFrom-Json
              # ConvertFrom-Json turns a JSON "[]" into $null, not an empty array.
              $entries = if ($null -eq $parsed) { @() } else { @($parsed) }

              foreach ($entry in $entries) {
                  if ($entry.downloadUrl -notmatch $pattern) {
                      $failures.Add("${path}: entry '$($entry.id)' has a non-'latest' downloadUrl: $($entry.downloadUrl)")
                  }
              }
          }

          if ($failures.Count -gt 0) {
              $failures | ForEach-Object { Write-Host "::error::$_" }
              throw "$($failures.Count) catalog entry/entries use a version-pinned downloadUrl instead of the version-less /releases/latest/download/ form."
          }

          Write-Host "All catalog downloadUrl entries use the version-less latest form."

      - name: Release-descriptor validation checks
        shell: pwsh
        run: ./scripts/Test-ReleaseDescriptor.Tests.ps1

      - name: Changelog build checks
        shell: pwsh
        run: ./scripts/Build-Changelog.Tests.ps1

      # The release workflow validates a descriptor only after its PR has merged, which is too late to fix
      # it without a second PR. Validate now every descriptor this PR adds or changes whose tag has not
      # shipped yet (release.yml releases both, see its "Resolve" step), `changes` included. A descriptor
      # whose tag exists is history, including those that predate `changes`, and is not re-checked.
      - name: Validate the release descriptor this pull request ships
        if: github.event_name == 'pull_request'
        shell: pwsh
        env:
          BASE_REF: origin/${{ github.base_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $touched = @(git diff --no-renames --diff-filter=AM --name-only "$env:BASE_REF...HEAD" -- '.github/release-manifests/*.json')
          if ($LASTEXITCODE -ne 0) { throw "git diff against $env:BASE_REF failed." }

          # The version rules (strictly above the last stable release, bump large enough for `changes`)
          # need that release. Ask GitHub rather than `git tag`: it is the list users download from, and
          # --exclude-pre-releases keeps previews out of it. Looked up once, on the first descriptor
          # that has not shipped, so a PR that only touches shipped history never calls the API.
          . ./scripts/ReleaseDescriptor.Validate.ps1
          $latestStable = $null
          $lookedUp = $false
          foreach ($path in ($touched | Where-Object { $_ })) {
            $tag = [System.IO.Path]::GetFileNameWithoutExtension($path)
            if (git tag --list $tag) {
              Write-Host "Skipping ${path}: $tag has already shipped."
              continue
            }
            if (-not $lookedUp) {
              $releases = gh release list --exclude-pre-releases --limit 100 --json tagName --jq '.[].tagName'
              if ($LASTEXITCODE -ne 0) { throw 'gh release list failed.' }
              $latestStable = Get-LatestStableTag -Tags @($releases)
              $lookedUp = $true
              Write-Host "Latest stable release: $latestStable"
            }
            ./scripts/Test-ReleaseDescriptor.ps1 -Tag $tag -LatestStableTag $latestStable
            ./scripts/Build-Changelog.ps1 -Descriptor $path -OutDir "changelog-check" | Out-Null
            Write-Host "Validated $path"
          }

      # Not a gate. A merge that touches the plugin without adding a descriptor is allowed and ships
      # nothing (releases are opt-in, see RELEASING.md); this only tells the author, on the run page and
      # the PR's checks, that their change will wait for the next descriptor. It must never fail CI, so
      # the step swallows its own errors.
      - name: Note unreleased plugin changes
        if: github.event_name == 'pull_request'
        continue-on-error: true
        shell: pwsh
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: |
          try {
            $src = @(git diff --no-renames --name-only "$env:BASE_REF...HEAD" -- 'src/SignaturePlugin')
            if ($LASTEXITCODE -ne 0) { throw "git diff against $env:BASE_REF failed." }
            $touched = @(git diff --no-renames --diff-filter=AM --name-only "$env:BASE_REF...HEAD" -- '.github/release-manifests/*.json')
            if ($LASTEXITCODE -ne 0) { throw "git diff against $env:BASE_REF failed." }
            # Only a descriptor that will actually release counts: editing one whose tag already shipped
            # publishes nothing.
            $descriptors = @($touched | Where-Object { $_ -and -not (git tag --list ([System.IO.Path]::GetFileNameWithoutExtension($_))) })
            if ($src -and -not $descriptors) {
              Write-Host '::notice title=Unreleased plugin changes::This pull request changes src/SignaturePlugin without a release descriptor. The changes are not published when it merges; they ship with the next descriptor (see RELEASING.md).'
            }
          }
          catch {
            Write-Host "::warning::Could not check for unreleased plugin changes: $($_.Exception.Message)"
          }
          exit 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # This repo consumes Ocrx.Engine as a released binary, never a source checkout, and always the
      # latest one: the engine that replay-parity runs against is the engine users run. A regression
      # in a new engine release failing a plugin PR is the signal we want, not noise; to isolate it,
      # re-run this workflow by hand with `engine_version` set. OCRX_ENGINE_PATH is what
      # Ocrx.Sdk.Testing's EngineLocator.Resolve() reads (see ReplayParityTests in both test
      # projects) to spawn the real engine for parity comparisons.
      - name: Download engine release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ENGINE_VERSION_OVERRIDE: ${{ inputs.engine_version }}
        run: |
          $engineVersion = $env:ENGINE_VERSION_OVERRIDE
          if (-not $engineVersion) {
            $engineVersion = (gh release view -R PetitCastor/ocrx-releases --json tagName --jq .tagName).Trim()
            if ($LASTEXITCODE -ne 0 -or -not $engineVersion) { throw "Could not resolve the latest ocrx-releases release." }
          }
          Write-Host "Testing against OCRX engine $engineVersion"
          "Tested against OCRX engine $engineVersion" >> $env:GITHUB_STEP_SUMMARY
          gh release download $engineVersion -R PetitCastor/ocrx-releases -p "Ocrx.Engine-*-win-x64.zip" -D .
          if ($LASTEXITCODE -ne 0) { throw "Could not download engine release $engineVersion." }
          Expand-Archive -Path "Ocrx.Engine-*-win-x64.zip" -DestinationPath engine
          $enginePath = (Get-ChildItem -Path engine -Filter "Ocrx.Engine.exe" -Recurse | Select-Object -First 1).FullName
          if (-not $enginePath) {
            Write-Error "Ocrx.Engine.exe not found after extracting the engine release."
            exit 1
          }
          echo "OCRX_ENGINE_PATH=$enginePath" >> $env:GITHUB_ENV

      - name: Restore
        run: dotnet restore OcrxPlugins.slnx

      - name: Build
        run: dotnet build OcrxPlugins.slnx --no-restore -c Release

      # Runs SignaturePlugin's unit suite plus its replay-parity tests against the real engine
      # binary above. MissionPlugin and RefineryPlugin are frozen proofs of concept outside
      # OcrxPlugins.slnx and have no tests — a green run here says nothing about them.
      # Serialize test projects: xUnit collections cannot coordinate the Windows OCR engine
      # processes spawned by separate test assemblies.
      - name: Test
        run: dotnet test OcrxPlugins.slnx --no-build -c Release --verbosity normal -m:1

      # A plugin owns parsing and nothing else: it must not name a transport type (Grpc,
      # RpcException), the wire proto namespace, or the engine assembly. `dotnet build` cannot catch
      # a re-coupling — a plugin that added `using Grpc.Core;` still compiles against the SDK's public
      # surface — so this greps plugin SOURCES (.cs only) for the forbidden references. Moved here
      # from the mono-repo's ci.yml (SPLIT-MANIFEST.md's "Workflow split plan") and re-pointed at
      # src/ directly: this repo has no src/Plugins/ level, every plugin sits at src/<Plugin>/. The
      # sweep is over src/, not the solution, so the frozen proofs of concept stay inside the gate
      # even though nothing builds them.
      - name: Plugin boundary grep gate
        shell: bash
        run: |
          if rg -n -g '*.cs' "using Grpc|RpcException|Ocrx\.Contracts\.Proto|Ocrx\.Engine" src/; then
            echo "::error::Plugin boundary violation — a plugin references an engine/transport internal (listed above)."
            exit 1
          fi
          echo "Plugin boundary clean: no engine/transport references under src/."

      # Neither the message nor the pattern may spell the retired name, or the gate matches its own
      # source. Writing the pattern with character classes reads as the same string to grep without
      # the literal appearing in this file, so the gate needs no exclusion for itself and does not
      # depend on a tool skipping dot-directories by default — which is the only reason the earlier
      # rg form passed. Same pattern as the gates in ocrx-engine, ocrx-sdk and ocrx-site.
      - name: Legacy identity gate
        shell: bash
        run: |
          matches=$(grep -RInE '[G]ameCapture|[g]amecapture' . \
            --exclude-dir=.git \
            --exclude-dir=bin \
            --exclude-dir=obj || true)
          if [ -n "$matches" ]; then
            echo "$matches"
            echo "::error::Stale legacy identity found."
            exit 1
          fi

      - name: Restore repository tools
        run: dotnet tool restore

      - name: Slopwatch
        run: dotnet slopwatch analyze -d .
